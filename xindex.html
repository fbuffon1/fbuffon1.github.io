<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lectura de Tráfico</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #f4eff8;
      background: #101010;
    }
    .card {
      background: #181719;
      border: 1px solid #302934;
      border-radius: 28px;
      padding: 48px 40px 44px;
      width: min(420px, 100%);
      text-align: center;
      box-shadow: 0 18px 56px rgba(0, 0, 0, 0.38);
    }
    .titulo {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #b68ac8;
      margin-bottom: 28px;
    }
    .input-wrap { position: relative; }
    input[type="number"] {
      border: 1px solid #39343d;
      border-radius: 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 400;
      color: #f4eff8;
      background: #222024;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.22);
    }
    input[type="number"] {
      min-width: 0;
      flex: 1;
      padding: 16px 18px;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]::placeholder { color: #817887; }
    input[type="number"]:focus {
      border-color: #bd5be8;
      background: #262228;
      box-shadow: 0 0 0 4px rgba(189, 91, 232, 0.13);
    }
    .divider {
      margin: 32px auto;
      width: 36px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(189, 91, 232, 0.65), transparent);
      border-radius: 2px;
    }
    .resultado-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .resultado {
      font-family: 'DM Mono', monospace;
      font-size: 42px;
      font-weight: 300;
      color: #d37af3;
      letter-spacing: -0.01em;
      line-height: 1;
      transition: opacity 0.12s;
      overflow-wrap: anywhere;
    }
    .unidad-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #a994b4;
      font-weight: 400;
    }
    @media (max-width: 420px) {
      .card { padding: 40px 22px; }
      .resultado { font-size: 34px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="titulo">Lectura de tráfico</p>
    <div class="input-wrap">
      <input type="number" id="valor" placeholder="Ingresa bytes..." oninput="convertir()" aria-label="Cantidad de bytes">
    </div>
    <div class="divider"></div>
    <div class="resultado-wrap" aria-live="polite">
      <div class="resultado" id="resultado">0 B</div>
      <div class="unidad-label" id="detalle"></div>
    </div>
  </main>
  <script>
    function convertir() {
      // La lectura se interpreta como una cantidad de bytes. Se aplican los
      // rangos indicados en la tabla y múltiplos decimales de 1000.
      const bytes = Number(document.getElementById('valor').value);
      const el = document.getElementById('resultado');
      const detalle = document.getElementById('detalle');

      if (!Number.isFinite(bytes) || bytes === 0) {
        el.textContent = '0 B';
        detalle.textContent = '';
        return;
      }

      const magnitud = Math.abs(bytes);
      const rangos = [
        { limite: 1e18, divisor: 1e18, unidad: 'EB' },
        { limite: 1e15, divisor: 1e15, unidad: 'PB' },
        { limite: 1e12, divisor: 1e12, unidad: 'TB' },
        { limite: 1e9,  divisor: 1e9,  unidad: 'GB' },
        { limite: 1e6,  divisor: 1e6,  unidad: 'Mbps' },
        { limite: 1e3,  divisor: 1e3,  unidad: 'KB' }
      ];
      const formato = rangos.find(rango => magnitud >= rango.limite);
      if (formato) {
        el.textContent = (bytes / formato.divisor).toFixed(2) + ' ' + formato.unidad;
      } else {
        el.textContent = Number.isInteger(bytes) ? bytes + ' B' : bytes.toFixed(2) + ' B';
      }
    }
  </script>
</body>
</html>
